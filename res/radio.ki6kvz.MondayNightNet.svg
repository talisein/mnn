<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <clipPath id="face">
      <rect x="12" y="12" width="104" height="100" rx="16"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="12" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36497a"/>
      <stop offset="1" stop-color="#3f5a8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="76" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6a9ccc" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6a9ccc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="beacon" cx="64" cy="45" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7b63" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff7b63" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile base (thickness) -->
  <rect x="12" y="16" width="104" height="100" rx="16" fill="#3a4a66"/>

  <g clip-path="url(#face)">
    <!-- sky -->
    <rect x="12" y="12" width="104" height="100" fill="url(#sky)"/>
    <rect x="12" y="12" width="104" height="100" fill="url(#glow)"/>

    <!-- hills, back to front -->
    <path d="M12 75 C30 71 42 72 58 76 S96 78 116 75 V112 H12 Z" fill="#88aeb8"/>
    <path d="M12 85 C30 82 50 86 66 87 S100 80 116 80 V112 H12 Z" fill="#6c97a4"/>
    <path d="M12 104 C34 98 56 94 76 95 S104 91 116 92 V112 H12 Z" fill="#4f7d8e"/>
  </g>

  <!-- top edge highlight -->
  <rect x="12.5" y="12.5" width="103" height="99" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- radio waves -->
  <g fill="none" stroke-linecap="round" stroke-width="2.6">
    <path d="M55.5 38 A12 12 0 0 0 55.5 56" stroke="#ffffff"/>
    <path d="M72.5 38 A12 12 0 0 1 72.5 56" stroke="#ffffff"/>
    <path d="M47 31 A23 23 0 0 0 47 63" stroke="#e6e9f2"/>
    <path d="M81 31 A23 23 0 0 1 81 63" stroke="#e6e9f2"/>
    <path d="M42 25 A32 32 0 0 0 42 69" stroke="#ffffff" stroke-opacity="0.4"/>
    <path d="M86 25 A32 32 0 0 1 86 69" stroke="#ffffff" stroke-opacity="0.4"/>
  </g>

  <!-- small antennas: green = heard directly, yellow = needs relay -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#57e389" stroke-width="0.9">
      <path d="M23.5 75 V68.5 M21.5 68.5 L23.5 71.1 L25.5 68.5"/>
      <path d="M105.5 77 V70.5 M103.5 70.5 L105.5 73.1 L107.5 70.5"/>
    </g>
    <path d="M84.5 82 V75.5 M82.5 75.5 L84.5 78.1 L86.5 75.5" stroke="#f6d32d" stroke-width="0.9"/>
    <path d="M29.5 100 V85 M25.5 85 L29.5 90 L33.5 85" stroke="#57e389" stroke-width="2"/>
    <path d="M98 95 V83.5 M94.4 83.5 L98 88 L101.6 83.5" stroke="#f6d32d" stroke-width="1.8"/>
  </g>

  <!-- lattice tower -->
  <g fill="none" stroke="#323d50" stroke-linejoin="round" stroke-linecap="round">
    <path d="M62.2 50 L53.5 111 M65.8 50 L74.5 111" stroke-width="2.4"/>
    <path stroke-width="1.5" d="
      M61.6 54 L66.4 54
      M61.6 54 L67.1 59 M66.4 54 L60.9 59
      M60.9 59 L67.1 59
      M60.9 59 L68.1 66 M67.1 59 L59.9 66
      M59.9 66 L68.1 66
      M59.9 66 L69.3 75 M68.1 66 L58.7 75
      M58.7 75 L69.3 75
      M58.7 75 L70.7 86 M69.3 75 L57.3 86
      M57.3 86 L70.7 86
      M57.3 86 L72.4 98 M70.7 86 L55.6 98
      M55.6 98 L72.4 98
      M55.6 98 L74.1 109 M72.4 98 L53.9 109"/>
  </g>
  <rect x="61" y="47.6" width="6" height="2.6" rx="1.1" fill="#323d50"/>

  <!-- beacon -->
  <circle cx="64" cy="45" r="6" fill="url(#beacon)"/>
  <path d="M62.2 47.6 V45 A1.8 1.8 0 0 1 65.8 45 V47.6 Z" fill="#ed333b"/>
</svg>
